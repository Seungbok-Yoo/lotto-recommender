# 매주 일요일 09:00 KST (토요일 추첨 다음 날) 에 당첨 이력을 갱신해 커밋한다.
# 커밋은 GITHUB_TOKEN 으로 하므로 deploy.yml 이 자동으로 이어지지 않는다 → 마지막에 직접 호출.
# 주의: GitHub 서버는 해외 IP 다. 동행복권이 막으면 실패하므로 먼저 수동 실행(Run workflow)으로 확인할 것.
name: Update lotto data

on:
  schedule:
    - cron: "0 0 * * 0"   # UTC 일요일 00:00 = KST 09:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new draws
        run: python lottery.py --update --stats

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- lotto_history.json; then
            echo "새 회차 없음"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lotto_history.json
            git commit -m "data: 당첨 이력 갱신 ($(date -u +%F))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
